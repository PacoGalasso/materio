services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: matiere
      POSTGRES_PASSWORD: matiere
      POSTGRES_DB: matiere_dev
    ports:
      # Host port 55432 (not 5432): avoids clashing with any pre-existing local Postgres
      # install/service on the developer machine. The container's internal port is unchanged.
      - "55432:5432"
    volumes:
      - matiere-db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matiere -d matiere_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  matiere-db-data:
