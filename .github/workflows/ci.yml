name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - claude/production-hardening

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://matiere:matiere@localhost:5432/matiere_ci
  TEST_DATABASE_URL: postgres://matiere:matiere@localhost:5432/matiere_ci_test
  BETTER_AUTH_SECRET: ci-only-secret-never-used-outside-this-workflow-32
  BETTER_AUTH_URL: http://localhost:3000
  NODE_ENV: test

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: matiere
          POSTGRES_PASSWORD: matiere
          POSTGRES_DB: matiere_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matiere -d matiere_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Both actions below are first-party, maintained directly by GitHub — pinned to their
      # major version tag (not a hand-copied SHA, which risks silently breaking CI if
      # transcribed wrong) per the project's dependency-pinning policy for trusted publishers.
      # Third-party actions, if any are ever added here, must be pinned to a commit SHA.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Create the test database
        run: |
          PGPASSWORD=matiere psql -h localhost -U matiere -d matiere_ci -c "CREATE DATABASE matiere_ci_test;"

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Dependency audit (fails on unresolved high/critical)
        run: npm audit --omit=dev --audit-level=high
